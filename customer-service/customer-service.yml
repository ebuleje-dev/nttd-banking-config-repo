# customer-service/customer-service.yml
server:
  port: 8082

spring:
  application:
    name: customer-service
  data:
    mongodb:
      uri: mongodb://host.docker.internal:27017/banking_customers
      auto-index-creation: true
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

#  kafka:
