# ====================================================================
# config-server/customer-service.yml
# ====================================================================

server:
  port: 8082
  forward-headers-strategy: framework

spring:
  application:
    name: customer-service

  # MongoDB Configuration
  data:
    mongodb:
      #uri: mongodb://host.docker.internal:27017/banking_customers
      uri: mongodb://localhost:27017/banking_customers
      auto-index-creation: true

    # Redis Configuration (Caché)
    redis:
      #host: host.docker.internal
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # Kafka Configuration
  kafka:
    #bootstrap-servers:  kafka:9092
    bootstrap-servers: localhost:29092
    consumer:
      group-id: customer-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

# Credit Card Validation Mock Configuration
# Set to false when real credit-card-service is available
credit-card:
  validation:
    mock:
      enabled: false
      always-approve: false
      
# Customer Products Mock Configuration
customer-products:
  mock:
    enabled: true      # true = use mock, false = use microservice
    generate-data: false # true = generate random data, false = return empty

# SpringDoc OpenAPI Configuration
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    try-it-out-enabled: true
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: false

# Eureka Client Configuration
eureka:
  client:
    service-url:
      #defaultZone: http://eureka-server:8761/eureka/
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    #instance-id: ${spring.application.name}:${random.value}
    instance-id: ${spring.application.name}:${server.port}

# Resilience4j Configuration
resilience4j:
  circuitbreaker:
    instances:
      customerService:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
        register-health-indicator: true
      creditCardValidation:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
        register-health-indicator: true
        slow-call-duration-threshold: 5s
        slow-call-rate-threshold: 80
        automatic-transition-from-open-to-half-open-enabled: true
      customerProducts:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
        register-health-indicator: true
        slow-call-duration-threshold: 5s
        slow-call-rate-threshold: 80
        automatic-transition-from-open-to-half-open-enabled: true
  timelimiter:
    instances:
      customerService:
        timeout-duration: 30s
        cancel-running-future: true
      creditCardValidation:
        timeout-duration: 30s
        cancel-running-future: true
      customerProducts:
        timeout-duration: 30s
        cancel-running-future: true

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,circuitbreakerevents
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
  health:
    circuitbreakers:
      enabled: true

# Logging Configuration
logging:
  level:
    root: INFO
    com.nttd.banking.customer: DEBUG
    io.github.resilience4j: DEBUG
    org.springframework.data.mongodb: INFO
    org.springframework.data.redis: INFO
    org.springframework.kafka: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    #file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  #file:
    #name: logs/customer-service.log
    #max-size: 10MB
    #max-history: 30