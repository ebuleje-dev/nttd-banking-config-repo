# ====================================================================
# account-service.yml
# ====================================================================

server:
  port: 8083
  forward-headers-strategy: framework

spring:
  application:
    name: account-service

  # MongoDB Configuration
  data:
    mongodb:
      #uri: mongodb://host.docker.internal:27017/banking_accounts
      uri: mongodb://localhost:27017/banking_accounts
      auto-index-creation: true

    # Redis Configuration (Caché)
    redis:
      #host: host.docker. internal
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # Kafka Configuration
  kafka:
    #bootstrap-servers: kafka:9092
    bootstrap-servers: localhost:29092
    consumer:
      group-id: account-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000

# Customer Validation Mock Configuration
# Set to false when real customer-service is available via Kafka
customer:
  validation:
    mock:
      enabled: true
      always-approve: true

# Credit Card Validation Mock Configuration
# Set to false when real credit-card-service is available via Kafka
credit-card:
  validation:
    mock:
      enabled: true
      always-approve: true
      always-has-card: true

# SpringDoc OpenAPI Configuration
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    try-it-out-enabled: true
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: false

# Eureka Client Configuration
eureka:
  client:
    service-url:
      #defaultZone: http://eureka-server:8761/eureka/
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    # Docker: true
    # local: false
    prefer-ip-address: false
    hostname: host.docker.internal #account-service
    lease-renewal-interval-in-seconds: 30
    #instance-id: ${spring.application.name}:${random.value}
    instance-id: ${spring.application.name}:${server.port}

# Resilience4j Configuration
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        register-health-indicator: true
        record-exceptions:
          - java.util.concurrent.TimeoutException
          - java.lang.RuntimeException
          - java.io.IOException
    instances:
      accountService:
        base-config: default
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        register-health-indicator: true
      customerValidation:
        base-config: default
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        slow-call-rate-threshold: 80
        slow-call-duration-threshold: 3s
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 1
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
      creditCardValidation:
        base-config: default
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        slow-call-rate-threshold: 80
        slow-call-duration-threshold: 3s
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 1
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
  timelimiter:
    instances:
      accountService:
        timeout-duration: 5s
        cancel-running-future: true
      customerValidation:
        timeout-duration: 5s
        cancel-running-future: true
      creditCardValidation:
        timeout-duration: 5s
        cancel-running-future: true

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,circuitbreakerevents
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
  info:
    env:
      enabled: true
  health:
    circuitbreakers:
      enabled: true
info:
    app:
      name: ${spring.application.name}
      description: Account Service - Banking Accounts Management
      version: 0.0.1-SNAPSHOT
      port: ${server.port}
    company:
      name: NTT Data Banking
      project: Bootcamp Final Project

# Logging Configuration
logging:
  level:
    root: INFO
    com.nttd.banking.account: DEBUG
    io.github.resilience4j: DEBUG
    org.springframework.data.mongodb: INFO
