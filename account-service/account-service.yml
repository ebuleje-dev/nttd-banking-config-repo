# ====================================================================
# account-service.yml
# ====================================================================

server:
  port: 8083
  forward-headers-strategy: framework

spring:
  application:
    name: account-service

  # MongoDB Configuration
  data:
    mongodb:
      #uri: mongodb://host.docker.internal:27017/banking_accounts
      uri: mongodb://localhost:27017/banking_accounts
      auto-index-creation: true

    # Redis Configuration (Caché)
    redis:
      #host: host.docker.internal
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # Kafka Configuration
  kafka:
    #bootstrap-servers: kafka:9092
    bootstrap-servers: localhost:29092
    consumer:
      group-id: account-service-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000

# Customer Validation Mock Configuration
customer:
  validation:
    mock:
      enabled: true  # Set to false when real customer-service is available via Kafka

# Credit Card Validation Mock Configuration
credit-card:
  validation:
    mock:
      enabled: true  # Set to false when real credit-card-service is available via Kafka

# Custom Kafka Configuration
kafka:
  enabled: true
  topics:
    # Topics that account-service PRODUCES
    account-created: account.account.created
    account-updated: account.account.updated
    account-closed: account.account.closed
    account-balance-updated: account.balance.updated

    # Topics that account-service CONSUMES from customer-service (NO mock)
    customer-created: customer.customer.created
    customer-updated: customer.customer.updated
    customer-profile-updated: customer.profile.updated

    # Topics for credit-card validation (with mock for now)
    credit-card-validation-request: credit-card.validation.request
    credit-card-validation-response: credit-card.validation.response

# SpringDoc OpenAPI Configuration
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    try-it-out-enabled: true
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: false

# Eureka Client Configuration
eureka:
  client:
    enabled: false  # Disabled for local development
    service-url:
      #defaultZone: http://eureka-server:8761/eureka/
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    # Docker: true
    # local: false
    prefer-ip-address: true
    hostname: host.docker.internal #account-service
    lease-renewal-interval-in-seconds: 30
    #instance-id: ${spring.application.name}:${random.value}
    instance-id: ${spring.application.name}:${server.port}

# ═══════════════════════════════════════════════════════════════════════════════
# CIRCUIT BREAKER - Resilience4j
# Solo para llamadas a servicios externos: customer-service, credit-card-service
# ═══════════════════════════════════════════════════════════════════════════════
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 5                  # Ventana de 5 llamadas
        minimum-number-of-calls: 3              # Mínimo 3 llamadas para evaluar
        failure-rate-threshold: 50              # 50% de fallos abre el circuito
        wait-duration-in-open-state: 30s        # 30s en estado OPEN antes de HALF-OPEN
        permitted-number-of-calls-in-half-open-state: 2  # 2 llamadas de prueba
        slow-call-rate-threshold: 80            # 80% de llamadas lentas abre circuito
        slow-call-duration-threshold: 3s        # Una llamada >3s se considera lenta
        register-health-indicator: true         # Exponer en /actuator/health
        record-exceptions:
          - java.util.concurrent.TimeoutException
          - java.lang.RuntimeException
          - java.io.IOException
    instances:
      accountService:
        base-config: default
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        register-health-indicator: true
      # Circuit Breaker para customer-service
      customerValidation:
        base-config: default
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        slow-call-rate-threshold: 80
        slow-call-duration-threshold: 3s
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 1
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
      # Circuit Breaker para credit-card-service
      creditCardValidation:
        base-config: default
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        slow-call-rate-threshold: 80
        slow-call-duration-threshold: 3s
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 1
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
        sliding-window-type: COUNT_BASED

  timelimiter:
    configs:
      default:
        timeout-duration: 5s                    # Timeout de 5 segundos
        cancel-running-future: true
    instances:
      accountService:
        base-config: default
        timeout-duration: 5s
        cancel-running-future: true
      customerValidation:
        base-config: default
        timeout-duration: 5s
        cancel-running-future: true
      creditCardValidation:
        base-config: default
        timeout-duration: 5s
        cancel-running-future: true

  # Métricas para monitoreo
  metrics:
    enabled: true

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers,circuitbreakerevents
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
  info:
    env:
      enabled: true
  health:
    circuitbreakers:
      enabled: true

# Info Endpoint
info:
  app:
    name: ${spring.application.name}
    description: Account Service - Banking Accounts Management
    version: 1.0.0

# Logging Configuration
logging:
  level:
    com.nttd.banking.account: DEBUG
    org.springframework.data.mongodb: INFO
    org.springframework.data.redis: INFO
    reactor.kafka: INFO
    org.apache.kafka: WARN
    io.github.resilience4j: DEBUG           # Ver eventos del Circuit Breaker
