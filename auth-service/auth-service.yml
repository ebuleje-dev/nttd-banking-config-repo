# auth-service/auth-service.yml
server:
  port: 8091

spring:
  data:
    mongodb:
      #uri: mongodb://host.docker.internal:27017/banking_auth
      uri: mongodb://localhost:27017/auth_db
      auto-index-creation: true
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: 1000ms
  kafka:
      #bootstrap-servers: localhost:9092
      #bootstrap-servers:  kafka:9092
      bootstrap-servers: localhost:29092
      consumer:
        group-id: auth-service-group
        auto-offset-reset: earliest
        key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
        value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      producer:
        key-serializer: org.apache.kafka.common.serialization.StringSerializer
        value-serializer: org.apache.kafka.common.serialization.StringSerializer
      mock:
        enabled: true

eureka:
  client:
    service-url:
      #defaultZone: http://eureka-server:8761/eureka/
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.nttd.banking.auth: DEBUG
    org.springframework: INFO

# JWT Configuration (environment variables)
#jwt:
  #secret: ${JWT_SECRET:changeme-secret-key-for-development-only}
  #expiration: 86400000  # 24 horas

 # Configuración JWT con claves RSA
jwt:
  private-key: classpath:keys/private-key.pem
  public-key: classpath:keys/public-key.pem
  access-token-expiration: 86400000      # 24 horas en ms
  refresh-token-expiration: 604800000    # 7 días en ms
