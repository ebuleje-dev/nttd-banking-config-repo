# credit-card-service/credit-card-service.yml
server:
  port: 8085

spring:
  data:
    mongodb:
      uri: mongodb://host.docker.internal:27017/banking_credit_cards
      auto-index-creation: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: credit-card-service-group
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

resilience4j:
  timelimiter:
    instances:
      creditCardService:
        timeout-duration: 2s

management:
  endpoints:
    web:
      exposure:
        include: '*'

logging:
  level:
    com.nttd.banking.creditcard: DEBUG