server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      routes:
        # =========================
        # CUSTOMER SERVICE
        # =========================
        - id: customer-service
          uri: lb://customer-service
          predicates:
            - Path=/api/customers/**
          filters:
            - StripPrefix=1
            - name: CircuitBreaker
              args:
                name: customerCircuitBreaker
                fallbackUri: forward:/fallback/customers

        # =========================
        # ACCOUNT SERVICE
        # =========================
        - id: account-service
          uri: lb://account-service
          predicates:
            - Path=/api/accounts/**
          filters:
            - StripPrefix=1
            - name: CircuitBreaker
              args:
                name: accountCircuitBreaker
                fallbackUri: forward:/fallback/accounts

        # =========================
        # CREDIT SERVICE
        # =========================
        - id: credit-service
          uri: lb://credit-service
          predicates:
            - Path=/api/credits/**
          filters:
            - StripPrefix=1
            - name: CircuitBreaker
              args:
                name: creditCircuitBreaker
                fallbackUri: forward:/fallback/credits

        # =========================
        # CREDIT CARD SERVICE
        # =========================
        - id: credit-card-service
          uri: lb://credit-card-service
          predicates:
            - Path=/api/credit-cards/**
          filters:
            - StripPrefix=1
            - name: CircuitBreaker
              args:
                name: creditCardCircuitBreaker
                fallbackUri: forward:/fallback/credit-cards

        # =========================
        # DEBIT CARD SERVICE
        # =========================
        - id: debit-card-service
          uri: lb://debit-card-service
          predicates:
            - Path=/api/debit-cards/**
          filters:
            - StripPrefix=1
            - name: CircuitBreaker
              args:
                name: debitCardCircuitBreaker
                fallbackUri: forward:/fallback/debit-cards

        # =========================
        # TRANSACTION SERVICE
        # =========================
        - id: transaction-service
          uri: lb://transaction-service
          predicates:
            - Path=/api/transactions/**
          filters:
            - StripPrefix=1
            - name: CircuitBreaker
              args:
                name: transactionCircuitBreaker
                fallbackUri: forward:/fallback/transactions

        # =========================
        # REPORT SERVICE
        # =========================
        - id: report-service
          uri: lb://report-service
          predicates:
            - Path=/api/reports/**
          filters:
            - StripPrefix=1
            - name: CircuitBreaker
              args:
                name: reportCircuitBreaker
                fallbackUri: forward:/fallback/reports

        # =========================
        # YANKI SERVICE
        # =========================
        - id: yanki-service
          uri: lb://yanki-service
          predicates:
            - Path=/api/yanki/**
          filters:
            - StripPrefix=1
            - name: CircuitBreaker
              args:
                name: yankiCircuitBreaker
                fallbackUri: forward:/fallback/yanki

        # =========================
        # BOOTCOIN SERVICE
        # =========================
        - id: bootcoin-service
          uri: lb://bootcoin-service
          predicates:
            - Path=/api/bootcoin/**
          filters:
            - StripPrefix=1
            - name: CircuitBreaker
              args:
                name: bootcoinCircuitBreaker
                fallbackUri: forward:/fallback/bootcoin

        # =========================
        # AUTH SERVICE
        # =========================
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1
            - name: CircuitBreaker
              args:
                name: authCircuitBreaker
                fallbackUri: forward:/fallback/auth

# =========================
# EUREKA CLIENT
# =========================
eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    hostname: api-gateway
    instance-id: ${spring.application.name}:${random.value}

# =========================
# RESILIENCE4J
# =========================
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
    instances:
      customerCircuitBreaker:
        base-config: default
      accountCircuitBreaker:
        base-config: default
      creditCircuitBreaker:
        base-config: default
      creditCardCircuitBreaker:
        base-config: default
      debitCardCircuitBreaker:
        base-config: default
      transactionCircuitBreaker:
        base-config: default
      reportCircuitBreaker:
        base-config: default
      yankiCircuitBreaker:
        base-config: default
      bootcoinCircuitBreaker:
        base-config: default
      authCircuitBreaker:
        base-config: default

  timelimiter:
    configs:
      default:
        timeout-duration: 3s
    instances:
      customerCircuitBreaker:
        base-config: default
      accountCircuitBreaker:
        base-config: default
      creditCircuitBreaker:
        base-config: default
      creditCardCircuitBreaker:
        base-config: default
      debitCardCircuitBreaker:
        base-config: default
      transactionCircuitBreaker:
        base-config: default
      reportCircuitBreaker:
        base-config: default
      yankiCircuitBreaker:
        base-config: default
      bootcoinCircuitBreaker:
        base-config: default
      authCircuitBreaker:
        base-config: default

# =========================
# ACTUATOR
# =========================
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true

# =========================
# LOGGING
# =========================
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.gateway.route: DEBUG
    org.springframework.cloud.loadbalancer: DEBUG
    reactor.netty: DEBUG