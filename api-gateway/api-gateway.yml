server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      routes:
        # =========================
        # AUTH SERVICE (Rutas Públicas)
        # =========================
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - RewritePath=/api/v1/auth/(?<segment>.*), /api/auth/$\{segment}
            - name: CircuitBreaker
              args:
                name: authCircuitBreaker
                fallbackUri: forward:/fallback/auth

        # =========================
        # CUSTOMER SERVICE
        # =========================
        - id: customer-service
          uri: lb://customer-service
          predicates:
            - Path=/api/v1/customers/**
          filters:
            - name: CircuitBreaker
              args:
                name: customerCircuitBreaker
                fallbackUri: forward:/fallback/customers

        # =========================
        # ACCOUNT SERVICE
        # =========================
        - id: account-service
          uri: lb://account-service
          predicates:
            - Path=/api/v1/accounts/**
          filters:
            - name: CircuitBreaker
              args:
                name: accountCircuitBreaker
                fallbackUri: forward:/fallback/accounts

        # =========================
        # CREDIT SERVICE
        # =========================
        - id: credit-service
          uri: lb://credit-service
          predicates:
            - Path=/api/v1/credits/**
          filters:
            - name: CircuitBreaker
              args:
                name: creditCircuitBreaker
                fallbackUri: forward:/fallback/credits

        # =========================
        # CREDIT CARD SERVICE
        # =========================
        - id: credit-card-service
          uri: lb://credit-card-service
          predicates:
            - Path=/api/v1/credit-cards/**
          filters:
            - name: CircuitBreaker
              args:
                name: creditCardCircuitBreaker
                fallbackUri: forward:/fallback/credit-cards

        # =========================
        # DEBIT CARD SERVICE
        # =========================
        - id: debit-card-service
          uri: lb://debit-card-service
          predicates:
            - Path=/api/v1/debit-cards/**
          filters:
            - name: CircuitBreaker
              args:
                name: debitCardCircuitBreaker
                fallbackUri: forward:/fallback/debit-cards

        # =========================
        # TRANSACTION SERVICE
        # =========================
        - id: transaction-service
          uri: lb://transaction-service
          predicates:
            - Path=/api/v1/transactions/**
          filters:
            - name: CircuitBreaker
              args:
                name: transactionCircuitBreaker
                fallbackUri: forward:/fallback/transactions

        # =========================
        # REPORT SERVICE
        # =========================
        - id: report-service
          uri: lb://report-service
          predicates:
            - Path=/api/v1/reports/**
          filters:
            - name: CircuitBreaker
              args:
                name: reportCircuitBreaker
                fallbackUri: forward:/fallback/reports

        # =========================
        # YANKI SERVICE
        # =========================
        - id: yanki-service
          uri: lb://yanki-service
          predicates:
            - Path=/api/v1/yanki/**
          filters:
            - name: CircuitBreaker
              args:
                name: yankiCircuitBreaker
                fallbackUri: forward:/fallback/yanki

        # =========================
        # BOOTCOIN SERVICE
        # =========================
        - id: bootcoin-service
          uri: lb://bootcoin-service
          predicates:
            - Path=/api/v1/bootcoin/**
          filters:
            - name: CircuitBreaker
              args:
                name: bootcoinCircuitBreaker
                fallbackUri: forward:/fallback/bootcoin

# =========================
# SECURITY CONFIGURATION
# =========================
security:
  jwt:
    jwks-uri: lb://auth-service/api/auth/.well-known/jwks.json
    cache-duration: 300
  public-paths:
    - /api/v1/auth/login
    - /api/v1/auth/register
    - /api/v1/auth/refresh
    - /api/v1/auth/.well-known/jwks.json
    - /actuator/**
    - /fallback/**

# =========================
# AUTHORIZATION (Role-Based Access Control)
# =========================
authorization:
  enabled: true
  super-admin-roles:
    - ROLE_ADMIN
  route-roles:
    /api/v1/customers/**:
      - ROLE_ADMIN
      - ROLE_EMPLOYEE
      - ROLE_CUSTOMER
    /api/v1/accounts/**:
      - ROLE_ADMIN
      - ROLE_EMPLOYEE
      - ROLE_CUSTOMER
    /api/v1/credits/**:
      - ROLE_ADMIN
      - ROLE_EMPLOYEE
      - ROLE_CUSTOMER
    /api/v1/credit-cards/**:
      - ROLE_ADMIN
      - ROLE_EMPLOYEE
      - ROLE_CUSTOMER
    /api/v1/debit-cards/**:
      - ROLE_ADMIN
      - ROLE_EMPLOYEE
      - ROLE_CUSTOMER
    /api/v1/transactions/**:
      - ROLE_ADMIN
      - ROLE_EMPLOYEE
      - ROLE_CUSTOMER
    /api/v1/reports/**:
      - ROLE_ADMIN
      - ROLE_EMPLOYEE
    /api/v1/yanki/**:
      - ROLE_ADMIN
      - ROLE_EMPLOYEE
      - ROLE_CUSTOMER
      - ROLE_YANKI_USER
    /api/v1/bootcoin/**:
      - ROLE_ADMIN
      - ROLE_EMPLOYEE
      - ROLE_CUSTOMER
      - ROLE_BOOTCOIN_USER

# =========================
# EUREKA CLIENT
# =========================
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    hostname: api-gateway
    instance-id: ${spring.application.name}:${server.port}

# =========================
# RESILIENCE4J
# =========================
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
    instances:
      customerCircuitBreaker:
        base-config: default
      accountCircuitBreaker:
        base-config: default
      creditCircuitBreaker:
        base-config: default
      creditCardCircuitBreaker:
        base-config: default
      debitCardCircuitBreaker:
        base-config: default
      transactionCircuitBreaker:
        base-config: default
      reportCircuitBreaker:
        base-config: default
      yankiCircuitBreaker:
        base-config: default
      bootcoinCircuitBreaker:
        base-config: default
      authCircuitBreaker:
        base-config: default

  timelimiter:
    configs:
      default:
        timeout-duration: 35s
    instances:
      customerCircuitBreaker:
        base-config: default
      accountCircuitBreaker:
        base-config: default
      creditCircuitBreaker:
        base-config: default
      creditCardCircuitBreaker:
        base-config: default
      debitCardCircuitBreaker:
        base-config: default
      transactionCircuitBreaker:
        base-config: default
      reportCircuitBreaker:
        base-config: default
      yankiCircuitBreaker:
        base-config: default
      bootcoinCircuitBreaker:
        base-config: default
      authCircuitBreaker:
        base-config: default

# =========================
# ACTUATOR CONFIGURATION
# =========================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true
