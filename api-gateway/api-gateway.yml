# api-gateway/api-gateway.yml
server:
  port: 8080

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: customer-service
          uri: lb://customer-service
          predicates:
            - Path=/api/customers/**
          filters:
            - name: CircuitBreaker
              args:
                name: customerCircuitBreaker

        - id: account-service
          uri: lb://account-service
          predicates:
            - Path=/api/accounts/**
          filters:
            - name: CircuitBreaker
              args:
                name: accountCircuitBreaker

        - id: credit-service
          uri: lb://credit-service
          predicates:
            - Path=/api/credits/**

        - id: credit-card-service
          uri: lb://credit-card-service
          predicates:
            - Path=/api/credit-cards/**

        - id: debit-card-service
          uri: lb://debit-card-service
          predicates:
            - Path=/api/debit-cards/**

        - id: transaction-service
          uri: lb://transaction-service
          predicates:
            - Path=/api/transactions/**

        - id: report-service
          uri: lb://report-service
          predicates:
            - Path=/api/reports/**

        - id: yanki-service
          uri: lb://yanki-service
          predicates:
            - Path=/api/yanki/**

        - id: bootcoin-service
          uri: lb://bootcoin-service
          predicates:
            - Path=/api/bootcoin/**

        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10000
  timelimiter:
    configs:
      default:
        timeout-duration: 2s

management:
  endpoints:
    web:
      exposure:
        include: '*'

logging:
  level:
    org.springframework.cloud.gateway: DEBUG