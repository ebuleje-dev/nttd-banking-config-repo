server:
  port: 8080

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      routes:
        - id: customer-service
          uri: lb://customer-service
          predicates:
            - Path=/api/customers/**
          filters:
            - name: CircuitBreaker
              args:
                name: customerCircuitBreaker
                fallbackUri: forward:/fallback/customers

        - id: account-service
          uri: lb://account-service
          predicates:
            - Path=/api/accounts/**
          filters:
            - name: CircuitBreaker
              args:
                name: accountCircuitBreaker
                fallbackUri: forward:/fallback/accounts

        - id: credit-service
          uri: lb://credit-service
          predicates:
            - Path=/api/credits/**
          filters:
            - name: CircuitBreaker
              args:
                name: creditCircuitBreaker
                fallbackUri: forward:/fallback/credits

        - id: credit-card-service
          uri: lb://credit-card-service
          predicates:
            - Path=/api/credit-cards/**
          filters:
            - name: CircuitBreaker
              args:
                name: creditCardCircuitBreaker
                fallbackUri: forward:/fallback/credit-cards

        - id: debit-card-service
          uri: lb://debit-card-service
          predicates:
            - Path=/api/debit-cards/**
          filters:
            - name: CircuitBreaker
              args:
                name: debitCardCircuitBreaker
                fallbackUri: forward:/fallback/debit-cards

        - id: transaction-service
          uri: lb://transaction-service
          predicates:
            - Path=/api/transactions/**
          filters:
            - name: CircuitBreaker
              args:
                name: transactionCircuitBreaker
                fallbackUri: forward:/fallback/transactions

        - id: report-service
          uri: lb://report-service
          predicates:
            - Path=/api/reports/**
          filters:
            - name: CircuitBreaker
              args:
                name: reportCircuitBreaker
                fallbackUri: forward:/fallback/reports

        - id: yanki-service
          uri: lb://yanki-service
          predicates:
            - Path=/api/yanki/**
          filters:
            - name: CircuitBreaker
              args:
                name: yankiCircuitBreaker
                fallbackUri: forward:/fallback/yanki

        - id: bootcoin-service
          uri: lb://bootcoin-service
          predicates:
            - Path=/api/bootcoin/**
          filters:
            - name: CircuitBreaker
              args:
                name: bootcoinCircuitBreaker
                fallbackUri: forward:/fallback/bootcoin

        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: authCircuitBreaker
                fallbackUri: forward:/fallback/auth

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    prefer-ip-address: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
    instances:
      customerCircuitBreaker:
        base-config: default
      accountCircuitBreaker:
        base-config: default
      creditCircuitBreaker:
        base-config: default
      creditCardCircuitBreaker:
        base-config: default
      debitCardCircuitBreaker:
        base-config: default
      transactionCircuitBreaker:
        base-config: default
      reportCircuitBreaker:
        base-config: default
      yankiCircuitBreaker:
        base-config: default
      bootcoinCircuitBreaker:
        base-config: default
      authCircuitBreaker:
        base-config: default

  timelimiter:
    configs:
      default:
        timeout-duration: 2s

management:
  endpoints:
    web:
      exposure:
        include: '*'

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
