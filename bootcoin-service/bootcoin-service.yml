# bootcoin-service/bootcoin-service.yml
server:
  port: 8090

spring:
  data:
    mongodb:
      uri: mongodb://host.docker.internal:27017/banking_bootcoin
      auto-index-creation: true
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: bootcoin-service-group
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

resilience4j:
  circuitbreaker:
    instances:
      bootcoinService:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10000
  timelimiter:
    instances:
      bootcoinService:
        timeout-duration: 2s

management:
  endpoints:
    web:
      exposure:
        include: '*'

logging:
  level:
    com.nttd.banking.bootcoin: DEBUG